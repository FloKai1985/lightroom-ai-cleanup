[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lr-cleanup"
version = "0.1.0"
description = "Privacy-first local analysis engine for Adobe Lightroom Classic photo cleanup"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Lightroom AI Cleanup" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "Pillow>=10.4",
    "ImageHash>=4.3",
    "httpx>=0.27",
    "mcp>=1.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # [cli] pulls in `mcp dev` (MCP Inspector) / `mcp run` / `mcp install` —
    # the official MCP dev/test tooling, not needed at runtime.
    "mcp[cli]>=1.2",
]

[project.scripts]
lr-cleanup = "lr_cleanup.cli:main"
lr-cleanup-server = "lr_cleanup.api.app:run"
lr-cleanup-mcp = "lr_cleanup.mcp_server.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lr_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/lr_cleanup/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom requires `Depends(...)` as an
# argument default — that's the framework's intended usage, not a bug.
"src/lr_cleanup/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
